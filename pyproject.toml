[project]
name = "fault-engine"
version = "0.1.0"
description = "Deterministic mitmproxy reverse-proxy fault scenarios"
requires-python = ">=3.12,<3.13"
dependencies = ["mitmproxy>=12,<13", "pydantic>=2.11,<3", "PyYAML>=6,<7", "aiohttp>=3.12,<4"]

[project.scripts]
fault-engine = "fault_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.28", "ruff", "ty", "pytest-cov"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv-docker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Black-box tests poll externally observable state under an asyncio timeout.
"tests/*.py" = ["ASYNC110"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.hatch.build.targets.wheel]
packages = ["src/fault_engine"]

[tool.coverage.run]
source = ["fault_engine"]
branch = true
patch = ["subprocess"]
