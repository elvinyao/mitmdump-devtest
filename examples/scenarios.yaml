version: 1
services:
  - id: orders
    host: 0.0.0.0
    port: 8080
    upstream: http://127.0.0.1:9000
  - id: inventory
    host: 0.0.0.0
    port: 8081
    upstream: http://127.0.0.1:9001
admin:
  host: 0.0.0.0
  port: 9090
  token_env: FAULT_ADMIN_TOKEN
state:
  capacity: 10000
  ttl_seconds: 3600
limits:
  max_connections: 256
  max_inflight_requests: 128
  state_page_size: 1000
rules:
  - id: sampled-unavailable
    service: orders
    match: {path: /sampled-unavailable}
    scope: X-Test-Run-ID
    probability: 0.25
    seed: 42
    sequence:
      - action: respond
        status: 503
        headers: {Retry-After: '1'}
        json_body: {error: sampled_unavailable}
    after_sequence: repeat_last
  - id: latency-jitter
    service: orders
    match: {path: /latency-jitter}
    scope: X-Test-Run-ID
    seed: 42
    sequence:
      - action: delay_after
        seconds: 0.05
        jitter_seconds: 0.15
    after_sequence: repeat_last
  - id: occasional-slow-response
    service: orders
    match: {path: /occasional-slow}
    scope: X-Test-Run-ID
    probability: 0.05
    seed: 42
    sequence:
      - action: delay_after
        seconds: 1
        jitter_seconds: 1
    after_sequence: repeat_last
  - id: retry-twice
    service: orders
    match:
      path: /retry
    scope: X-Test-Run-ID
    sequence:
      - action: respond
        status: 429
        headers:
          Retry-After: '1'
        json_body: {error: retry_later}
        repeat: 2
    after_sequence: passthrough
  - id: nth-error
    service: orders
    match:
      path: /nth
    scope: X-Test-Run-ID
    start_at: 5
    sequence:
      - action: respond
        status: 503
        repeat: 2
  - id: fixed-success
    service: orders
    match:
      path: /mock
    sequence:
      - action: respond
        status: 400
        repeat: 2
      - action: respond
        status: 200
        json_body: {ok: true}
    after_sequence: repeat_last
  - id: before
    service: orders
    match: {path: /slow-before}
    sequence:
      - action: delay_before
        seconds: 3
    after_sequence: repeat_last
  - id: after
    service: orders
    match: {path: /slow-after}
    sequence:
      - action: delay_after
        seconds: 3
    after_sequence: repeat_last
  - id: no-response
    service: orders
    match: {path: /timeout}
    sequence:
      - action: timeout
        seconds: 10
    after_sequence: repeat_last
  - id: tcp-reset
    service: orders
    match: {path: /reset}
    sequence:
      - action: reset
    after_sequence: repeat_last
  - id: disconnect
    service: orders
    match: {path: /disconnect}
    sequence:
      - action: disconnect
    after_sequence: repeat_last
  - id: inventory-cycle
    service: inventory
    match: {path: /cycle, methods: [GET, POST, PUT]}
    sequence:
      - action: respond
        status: 500
      - action: passthrough
    after_sequence: cycle
  - id: authentication-required
    service: orders
    match: {path: /unauthorized}
    sequence:
      - action: respond
        status: 401
        headers: {WWW-Authenticate: 'Bearer realm="test"'}
        json_body: {error: token_expired}
    after_sequence: repeat_last
  - id: write-conflict
    service: orders
    match: {path: /conflict, methods: [POST, PUT, PATCH]}
    sequence:
      - action: respond
        status: 409
        json_body: {error: version_conflict}
    after_sequence: repeat_last
  - id: retry-budget
    service: orders
    match: {path: /always-unavailable}
    sequence:
      - action: respond
        status: 503
        headers: {Retry-After: '1'}
        json_body: {error: unavailable}
    after_sequence: repeat_last
  - id: malformed-json
    service: orders
    match: {path: /invalid-json}
    sequence:
      - action: respond
        status: 200
        headers: {Content-Type: application/json}
        body: '{"incomplete":'
    after_sequence: repeat_last
  - id: html-gateway-error
    service: orders
    match: {path: /html-error}
    sequence:
      - action: respond
        status: 502
        headers: {Content-Type: text/html}
        body: '<html><body>Bad Gateway</body></html>'
    after_sequence: repeat_last
  - id: empty-json-response
    service: orders
    match: {path: /empty-json}
    sequence:
      - action: respond
        status: 200
        headers: {Content-Type: application/json}
    after_sequence: repeat_last
  - id: business-error
    service: orders
    match: {path: /business-error}
    sequence:
      - action: respond
        status: 200
        json_body: {ok: false, error: quota_exceeded}
    after_sequence: repeat_last
  - id: preserve-method-redirect
    service: orders
    match: {path: /redirect}
    sequence:
      - action: respond
        status: 307
        headers: {Location: /echo}
    after_sequence: repeat_last
  - id: slow-mock
    service: orders
    match: {path: /slow-mock}
    sequence:
      - action: respond
        status: 200
        delay_seconds: 3
        json_body: {ok: true}
    after_sequence: repeat_last
  - id: write-then-error
    service: orders
    match: {path: /write-then-error, methods: [POST]}
    scope: X-Test-Run-ID
    sequence:
      - action: respond_after
        status: 503
        json_body: {error: acknowledgement_lost}
    after_sequence: passthrough
  - id: write-then-reset
    service: orders
    match: {path: /write-then-reset, methods: [POST]}
    scope: X-Test-Run-ID
    sequence:
      - action: reset_after
    after_sequence: passthrough
  - id: write-then-disconnect
    service: orders
    match: {path: /write-then-disconnect, methods: [POST]}
    scope: X-Test-Run-ID
    sequence:
      - action: disconnect_after
    after_sequence: passthrough
  - id: mixed-retry
    service: orders
    match: {path: /mixed-retry}
    scope: X-Test-Run-ID
    sequence:
      - action: timeout
        seconds: 3
      - action: respond
        status: 503
      - action: respond
        status: 200
        json_body: {ok: true}
    after_sequence: repeat_last
  # All match fields must agree; retries reuse the same scope header.
  - id: targeted-write-retry
    service: orders
    match:
      methods: [POST, PUT]
      path_regex: /payments/[0-9]+
      headers: {X-Client: mobile}
      query: {mode: fault}
    scope: X-Test-Run-ID
    sequence:
      - action: respond
        status: 429
        headers: {Retry-After: '1'}
        json_body: {error: targeted_rate_limit}
        repeat: 2
    after_sequence: passthrough
  # The health exception must appear before the broader maintenance rule.
  - id: maintenance-health-exception
    service: orders
    match: {path: /maintenance/health, methods: [GET]}
    sequence:
      - action: passthrough
    after_sequence: repeat_last
  - id: maintenance-window
    service: orders
    match: {path_regex: '/maintenance/.*'}
    sequence:
      - action: respond
        status: 503
        headers: {Retry-After: '5'}
        json_body: {error: maintenance}
    after_sequence: repeat_last
  # Warm up once, then alternate two failures and two real backend responses.
  - id: recovery-cycle
    service: orders
    match: {path: /recovery-cycle}
    scope: X-Test-Run-ID
    start_at: 3
    sequence:
      - action: respond
        status: 503
        repeat: 2
      - action: passthrough
        repeat: 2
    after_sequence: cycle
  - id: cached-resource
    service: orders
    match:
      path: /cached
      methods: [GET, HEAD]
      headers: {If-None-Match: '"demo-v1"'}
    sequence:
      - action: respond
        status: 304
        headers: {ETag: '"demo-v1"'}
    after_sequence: repeat_last
  - id: delete-no-content
    service: orders
    match: {path: /no-content, methods: [DELETE]}
    sequence:
      - action: respond
        status: 204
    after_sequence: repeat_last
  - id: binary-download
    service: orders
    match: {path: /binary, methods: [GET, HEAD]}
    sequence:
      - action: respond
        status: 200
        headers: {Content-Type: application/octet-stream}
        body_base64: AAH/gA==
    after_sequence: repeat_last
  - id: gateway-timeout
    service: orders
    match: {path: /gateway-timeout}
    sequence:
      - action: respond
        status: 504
        json_body: {error: gateway_timeout}
    after_sequence: repeat_last
