version: 1
services:
  - id: orders
    host: 0.0.0.0
    port: 8080
    upstream: http://127.0.0.1:9000
  - id: inventory
    host: 0.0.0.0
    port: 8081
    upstream: http://127.0.0.1:9001
admin:
  host: 0.0.0.0
  port: 9090
  token_env: FAULT_ADMIN_TOKEN
state:
  capacity: 10000
  ttl_seconds: 3600
rules:
  - id: retry-twice
    service: orders
    match:
      path: /retry
    scope: X-Test-Run-ID
    sequence:
      - action: respond
        status: 429
        headers:
          Retry-After: '1'
        json_body: {error: retry_later}
        repeat: 2
    after_sequence: passthrough
  - id: nth-error
    service: orders
    match:
      path: /nth
    scope: X-Test-Run-ID
    start_at: 5
    sequence:
      - action: respond
        status: 503
        repeat: 2
  - id: fixed-success
    service: orders
    match:
      path: /mock
    sequence:
      - action: respond
        status: 400
        repeat: 2
      - action: respond
        status: 200
        json_body: {ok: true}
    after_sequence: repeat_last
  - id: before
    service: orders
    match: {path: /slow-before}
    sequence:
      - action: delay_before
        seconds: 3
    after_sequence: repeat_last
  - id: after
    service: orders
    match: {path: /slow-after}
    sequence:
      - action: delay_after
        seconds: 3
    after_sequence: repeat_last
  - id: no-response
    service: orders
    match: {path: /timeout}
    sequence:
      - action: timeout
        seconds: 10
    after_sequence: repeat_last
  - id: tcp-reset
    service: orders
    match: {path: /reset}
    sequence:
      - action: reset
    after_sequence: repeat_last
  - id: disconnect
    service: orders
    match: {path: /disconnect}
    sequence:
      - action: disconnect
    after_sequence: repeat_last
  - id: inventory-cycle
    service: inventory
    match: {path: /cycle, methods: [GET, POST, PUT]}
    sequence:
      - action: respond
        status: 500
      - action: passthrough
    after_sequence: cycle
  - id: authentication-required
    service: orders
    match: {path: /unauthorized}
    sequence:
      - action: respond
        status: 401
        headers: {WWW-Authenticate: 'Bearer realm="test"'}
        json_body: {error: token_expired}
    after_sequence: repeat_last
  - id: write-conflict
    service: orders
    match: {path: /conflict, methods: [POST, PUT, PATCH]}
    sequence:
      - action: respond
        status: 409
        json_body: {error: version_conflict}
    after_sequence: repeat_last
  - id: retry-budget
    service: orders
    match: {path: /always-unavailable}
    sequence:
      - action: respond
        status: 503
        headers: {Retry-After: '1'}
        json_body: {error: unavailable}
    after_sequence: repeat_last
  - id: malformed-json
    service: orders
    match: {path: /invalid-json}
    sequence:
      - action: respond
        status: 200
        headers: {Content-Type: application/json}
        body: '{"incomplete":'
    after_sequence: repeat_last
  - id: html-gateway-error
    service: orders
    match: {path: /html-error}
    sequence:
      - action: respond
        status: 502
        headers: {Content-Type: text/html}
        body: '<html><body>Bad Gateway</body></html>'
    after_sequence: repeat_last
  - id: empty-json-response
    service: orders
    match: {path: /empty-json}
    sequence:
      - action: respond
        status: 200
        headers: {Content-Type: application/json}
    after_sequence: repeat_last
  - id: business-error
    service: orders
    match: {path: /business-error}
    sequence:
      - action: respond
        status: 200
        json_body: {ok: false, error: quota_exceeded}
    after_sequence: repeat_last
  - id: preserve-method-redirect
    service: orders
    match: {path: /redirect}
    sequence:
      - action: respond
        status: 307
        headers: {Location: /echo}
    after_sequence: repeat_last
  - id: slow-mock
    service: orders
    match: {path: /slow-mock}
    sequence:
      - action: respond
        status: 200
        delay_seconds: 3
        json_body: {ok: true}
    after_sequence: repeat_last
  - id: write-then-error
    service: orders
    match: {path: /write-then-error, methods: [POST]}
    scope: X-Test-Run-ID
    sequence:
      - action: respond_after
        status: 503
        json_body: {error: acknowledgement_lost}
    after_sequence: passthrough
  - id: write-then-reset
    service: orders
    match: {path: /write-then-reset, methods: [POST]}
    scope: X-Test-Run-ID
    sequence:
      - action: reset_after
    after_sequence: passthrough
  - id: write-then-disconnect
    service: orders
    match: {path: /write-then-disconnect, methods: [POST]}
    scope: X-Test-Run-ID
    sequence:
      - action: disconnect_after
    after_sequence: passthrough
  - id: mixed-retry
    service: orders
    match: {path: /mixed-retry}
    scope: X-Test-Run-ID
    sequence:
      - action: timeout
        seconds: 3
      - action: respond
        status: 503
      - action: respond
        status: 200
        json_body: {ok: true}
    after_sequence: repeat_last
